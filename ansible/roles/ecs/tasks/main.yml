---
- name: Ensure /etc/ecs directory exists
  ansible.builtin.file:
    path: /etc/ecs
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure ECS Container Agent attributes
  ansible.builtin.lineinfile:
    path: /etc/ecs/ecs.config
    regexp: "^ECS_CLUSTER="
    line: "ECS_CLUSTER=taskflow-prod-cluster"
    create: true
    mode: '0644'

- name: Enable automatic image cleanup on the ECS host
  ansible.builtin.lineinfile:
    path: /etc/ecs/ecs.config
    regexp: "^ECS_IMAGE_CLEANUP_INTERVAL="
    line: "ECS_IMAGE_CLEANUP_INTERVAL=30m"
    create: true
    mode: '0644'

- name: Ensure ECS agent service is enabled and running
  ansible.builtin.systemd:
    name: ecs
    enabled: true
    state: started