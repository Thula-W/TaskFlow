---
- name: Ensure /opt/taskflow directory exists
  ansible.builtin.file:
    path: /opt/taskflow
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Amazon CloudWatch Agent package
  ansible.builtin.dnf:
    name: amazon-cloudwatch-agent
    state: present

- name: Deploy CloudWatch Agent source configuration JSON (Ansible-managed, untouched by the agent)
  ansible.builtin.template:
    src: amazon-cloudwatch-agent.json.j2
    dest: /opt/taskflow/cloudwatch-agent-source.json
    owner: root
    group: root
    mode: '0644'
  notify: Apply CloudWatch Agent configuration

- name: Ensure CloudWatch Agent service is enabled and running
  ansible.builtin.systemd:
    name: amazon-cloudwatch-agent
    enabled: true
    state: started
